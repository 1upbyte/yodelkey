<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password required - YodelKey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background:
                linear-gradient(180deg, rgba(23, 20, 17, 0.35), rgba(23, 20, 17, 0.45)),
                url('/static/wallpaper.jpg') center / cover fixed;
            color: #f2ede4;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(50, 46, 40, 0.92);
            border: 1px solid rgba(212, 180, 153, 0.15);
            border-radius: 20px;
            padding: 30px 40px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        h1 {
            color: #d4b499;
            font-size: 1.5rem;
            text-align: center;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #a89e8f;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .error {
            text-align: center;
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: #201d1a;
            border: 2px solid #4a4438;
            border-radius: 6px;
            color: #f2ede4;
            font-size: 1rem;
            font-family: inherit;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #d4b499;
            box-shadow: 0 0 0 3px rgba(212, 180, 153, 0.1);
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4b499 0%, #c2a184 100%);
            color: #262019;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 12px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 180, 153, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Password required</h1>
        <p class="subtitle">This item is password protected.</p>
        {% if wrong %}<p class="error">Incorrect password, try again.</p>{% endif %}
        <form method="get" action="">
            <input type="password" name="pass" placeholder="Enter password" autofocus required autocomplete="off" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other">
            <button type="submit">Unlock</button>
        </form>
    </div>
</body>
</html>
