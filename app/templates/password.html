<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password required - YodelKey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: #252541;
            border-radius: 16px;
            padding: 30px 40px;
        }

        h1 {
            color: #a8d8ea;
            font-size: 1.5rem;
            text-align: center;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #9e9e9e;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .error {
            text-align: center;
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: #1a1a2e;
            border: 2px solid #3a3a5a;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1rem;
            font-family: inherit;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #a8d8ea;
            box-shadow: 0 0 0 3px rgba(168, 216, 234, 0.1);
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #a8d8ea 0%, #8fc8de 100%);
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 216, 234, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Password required</h1>
        <p class="subtitle">This item is password protected.</p>
        {% if wrong %}<p class="error">Incorrect password, try again.</p>{% endif %}
        <form method="get" action="">
            <input type="password" name="pass" placeholder="Enter password" autofocus required autocomplete="off" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other">
            <button type="submit">Unlock</button>
        </form>
    </div>
</body>
</html>
